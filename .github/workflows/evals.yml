name: Evaluation runner

on:
  push:
    paths:
      - 'evals/writing/**'
      - '.github/workflows/evals.yml'
  pull_request:
    paths:
      - 'evals/writing/**'
      - '.github/workflows/evals.yml'

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: node --test evals/writing/core.test.ts evals/writing/ui/core.test.ts
